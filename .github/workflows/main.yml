name: "Release"
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.5.0)"
        required: true

jobs:
  sign:
    name: "Release"
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: "web-ext build"
        id: web-ext-build
        uses: kewisch/action-web-ext@v1
        with:
          cmd: build
          source: extension

      - name: "web-ext sign"
        id: web-ext-sign
        uses: kewisch/action-web-ext@v1
        with:
          cmd: sign
          source: ${{ steps.web-ext-build.outputs.target }}
          channel: unlisted
          apiKey: ${{ secrets.AMO_SIGN_KEY }}
          apiSecret: ${{ secrets.AMO_SIGN_SECRET }}
          timeout: 900000

      - name: "Rename xpi"
        id: rename-xpi
        run: mv ${{ steps.web-ext-sign.outputs.target }} itvx-adblocker-firefox-${TAG}.xpi

      - name: "Zip /extension"
        id: zip-extension
        run: git archive --prefix=itvx-adblocker-chrome-${TAG}/ -o web-ext-artifacts/itvx-adblocker-chrome-${TAG}.zip HEAD:extension

      - name: "Build update.json"
        id: update-manifest
        run: |
          VERSION="${TAG#v}"
          EXT_ID=$(jq -r '.browser_specific_settings.gecko.id' extension/manifest.json)
          XPI_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/itvx-adblocker-firefox-${TAG}.xpi"
          XPI_HASH="sha256:$(sha256sum itvx-adblocker-firefox-${TAG}.xpi | cut -d' ' -f1)"
          jq -n \
            --arg id "$EXT_ID" \
            --arg version "$VERSION" \
            --arg link "$XPI_URL" \
            --arg hash "$XPI_HASH" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link, update_hash: $hash}]}}}' \
            > update.json

      - name: "Create Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          files: |
            itvx-adblocker-firefox-${{ env.TAG }}.xpi
            itvx-adblocker-chrome-${{ env.TAG }}.zip
            update.json
