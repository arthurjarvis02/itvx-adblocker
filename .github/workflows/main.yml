name: "Release"
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  sign:
    name: "Release"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v1

      - name: "web-ext build"
        id: web-ext-build
        uses: kewisch/action-web-ext@v1
        with:
          cmd: build
          source: extension

      - name: "web-ext sign"
        id: web-ext-sign
        uses: kewisch/action-web-ext@v1
        with:
          cmd: sign
          source: ${{ steps.web-ext-build.outputs.target }}
          channel: unlisted
          apiKey: ${{ secrets.AMO_SIGN_KEY }}
          apiSecret: ${{ secrets.AMO_SIGN_SECRET }}
          timeout: 900000

      - name: "Rename xpi"
        id: rename-xpi
        run: mv ${{ steps.web-ext-sign.outputs.target }} itvx-adblocker-firefox-${{ github.ref_name }}.xpi

      - name: "Zip /extension"
        id: zip-extension
        run: git archive -o web-ext-artifacts/itvx-adblocker-chrome-${{ github.ref_name }}.zip HEAD:extension

      - name: "Build update.json"
        id: update-manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXT_ID=$(jq -r '.browser_specific_settings.gecko.id' extension/manifest.json)
          XPI_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/itvx-adblocker-firefox-${GITHUB_REF_NAME}.xpi"
          XPI_HASH="sha256:$(sha256sum itvx-adblocker-firefox-${GITHUB_REF_NAME}.xpi | cut -d' ' -f1)"
          jq -n \
            --arg id "$EXT_ID" \
            --arg version "$VERSION" \
            --arg link "$XPI_URL" \
            --arg hash "$XPI_HASH" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link, update_hash: $hash}]}}}' \
            > update.json

      - name: "Create Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            itvx-adblocker-firefox-${{ github.ref_name }}.xpi
            itvx-adblocker-chrome-${{ github.ref_name }}.zip
            update.json
